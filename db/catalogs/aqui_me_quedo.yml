# Catálogo de "Aquí me quedo · Sea food & beer" (empresa 1 en producción; cargado el 2026-10-20 por SSH) (Carretera Progreso-Teñhe, Col. Árbol Grande, Mixquiahuala, Hgo.).
# Platillos y precios tomados de las fotos del menú (2026-10-20). Costos y existencias no vienen en el menú.
#
#   bin/rails "catalog:load[db/catalogs/aqui_me_quedo.yml]"
#
# Se puede volver a correr: actualiza por SKU nombre, precio, categoría y estación; la entrada de inventario
# (`stock`) solo se registra si el producto aún no tiene movimientos de inventario.
# `tracks_stock: true` descuenta inventario al cerrar una cuenta y marca "agotado" en cero, así que solo se activa
# en los productos con existencias capturadas.

