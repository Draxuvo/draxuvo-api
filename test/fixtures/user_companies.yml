# role (por empresa): 0 staff, 2 admin, 3 owner. super_admin es global (users.role).
<% %w[one two basic_co pro_co enterprise_co expired_co past_due_co].each do |co| %>
<%= co %>_owner:
  user: <%= co %>_owner
  company: <%= co %>
  role: 3
<% end %>

pro_staff:
  user: pro_staff
  company: pro_co
  role: 0

expired_staff:
  user: expired_staff
  company: expired_co
  role: 0

<% { "owner" => 3, "waiter" => 0, "waiter2" => 0 }.each do |who, role| %>
resto_<%= who %>:
  user: resto_<%= who %>
  company: resto_co
  role: <%= role %>
<% end %>
