# Blueprint de producción de la API de Draxuvo (spec 012). Inventario de variables, con valores
# esperados y responsables: specs/012-deploy-produccion/contracts/env-inventory.md del workspace.
#
# Dos servicios con la misma imagen (spec 064): la API (web) y el worker de trabajos en segundo plano
# (draxuvo-jobs, Solid Queue en modo async). Los dos en plan `0.5c-512mb` (~$7 al mes cada uno) y la base en
# `0.1c-256mb`. Del 2026-11-16 al corte de la spec 064 la API estuvo en `1c-2g` (~$25) porque Solid Queue corría
# dentro de Puma y no cabía en 512 MB. Los precios cambian: confirmarlos en render.com/pricing. El almacenamiento
# de la base se cobra aparte (1 GB).

# La base de datos NO está en este Blueprint: `draxuvo-db` (Postgres 17, plan 0.1c-256mb, Virginia, 1 GB,
# sin acceso externo) se creó aparte en el workspace Draxuvo. Su URL interna se carga como DATABASE_URL.

# Variables comunes de la API y el worker: un solo lugar para que nunca difieran (SECRET_KEY_BASE distinta cierra
# las sesiones y deja ilegible la llave de WhatsApp; los dos escriben `[boot] secret_key_base sha256:` al arrancar
# para comprobarlo). En Render una variable del servicio gana sobre la del grupo: no duplicarlas en el servicio.
envVarGroups:
  - name: draxuvo-api-shared
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: DATABASE_URL        # URL interna de draxuvo-db (misma región, red privada)
        sync: false
      - key: SECRET_KEY_BASE     # firma los JWT y cifra la llave de WhatsApp: copiar el valor actual, nunca generar otro
        sync: false
      # Hosts y orígenes (CORS): ver FR-001 y FR-005 de la spec 012.
      - key: APP_HOST
        value: api.draxuvo.com
      - key: ALLOWED_HOSTS
        value: api.draxuvo.com
      - key: FRONTEND_URL          # panel (ui): enlaces de correo y CORS
        value: https://app.draxuvo.com
      - key: FRONTEND_URL_UI       # sitio público (web): CORS
        value: https://draxuvo.com
      - key: PUBLIC_SITE_URL       # menú QR (spec 059): lo que codifica el QR y origen CORS de /api/v1/public/*
        value: https://draxuvo.com
      # Correo (Resend)
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: Draxuvo <no-reply@draxuvo.com>
      # Stripe: modo prueba al lanzar (FR-008)
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Solo la leen los seeds al crear el super admin (db:prepare en la primera ejecución)
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      # Versión mínima de la app móvil; se sube aquí sin publicar una build nueva (FR-015)
      - key: MIN_APP_VERSION_IOS
        value: 0.0.0
      - key: MIN_APP_VERSION_ANDROID
        value: 0.0.0
      # Archivos subidos (avatares, fotos de órdenes, imágenes de productos): Cloudflare R2.
      # El disco del contenedor es efímero; sin esto se pierden en cada despliegue.
      - key: ACTIVE_STORAGE_SERVICE
        value: r2
      - key: R2_ACCOUNT_ID
        value: 653dfb7bcb7b75b826d6cef4f1a9947d
      - key: R2_BUCKET
        value: draxuvo-uploads
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      # WhatsApp (WHATSAPP_*) queda sin definir a propósito: desactivado en el lanzamiento (FR-009). Las opcionales
      # que se agreguen en Render (PUSH_ENABLED, EXPO_ACCESS_TOKEN, DEMO_*, LOGIN_RATE_*, ...) van también en el grupo.

services:
  - type: web
    name: draxuvo-api
    runtime: docker
    region: virginia             # misma región que la base (conexión por red privada)
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    # El despliegue lo dispara el job `deploy` de .github/workflows/ci.yml con el Deploy Hook, solo con el CI en
    # verde (FR-002). El servicio no está conectado a la app de GitHub de Render, así que no hay auto-deploy propio.
    autoDeployTrigger: "off"
    envVars:
      - fromGroup: draxuvo-api-shared
      # Puma en modo single (sin workers): en 512 MB el worker extra agotaba la memoria y Render mataba
      # la instancia (oomKilled, health check con timeout).
      - key: WEB_CONCURRENCY
        value: "0"
      # La API ya no procesa la cola (spec 064): lo hace draxuvo-jobs. Vuelta de emergencia si el worker falla:
      # SOLID_QUEUE_IN_PUMA=true aquí (corre Solid Queue dentro de Puma, config/puma.rb), con la API en 1c-2g.

  # Trabajos en segundo plano (spec 064): recurrentes de config/recurring.yml y encolados (correos, fotos, importaciones,
  # push). Misma imagen que la API; bin/jobs espera a que la API termine de migrar antes de tomar trabajos.
  - type: worker
    name: draxuvo-jobs
    runtime: docker
    region: virginia
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerCommand: ./bin/jobs
    # SIGTERM al desplegar: Solid Queue deja terminar los trabajos hasta 100 s (config.solid_queue.shutdown_timeout)
    # y Render espera 120 s antes de SIGKILL.
    maxShutdownDelaySeconds: 120
    # Lo despliega el mismo job `deploy` del CI con su propio Deploy Hook, siempre al mismo commit que la API.
    autoDeployTrigger: "off"
    envVars:
      - fromGroup: draxuvo-api-shared
      # Un solo proceso (Solid Queue 1.4.x): supervisor, despachador, programador y trabajadores como hilos.
      - key: SOLID_QUEUE_SUPERVISOR_MODE
        value: async
      # Grupo de conexiones a la base del worker (config/database.yml). En async lo comparten los hilos de trabajo,
      # el despachador, el programador y los latidos.
      - key: RAILS_MAX_THREADS
        value: "10"
