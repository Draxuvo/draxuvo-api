# Blueprint de producción de la API de Draxuvo (spec 012). Inventario de variables, con valores
# esperados y responsables: specs/012-deploy-produccion/contracts/env-inventory.md del workspace.
#
# Plan web `0.5c-512mb` (antes Starter) y base `0.1c-256mb` (antes Basic-256mb). Los precios cambian:
# confirmarlos en render.com/pricing. El almacenamiento de la base se cobra aparte (1 GB).

# La base de datos NO está en este Blueprint: `draxuvo-db` (Postgres 17, plan 0.1c-256mb, Virginia, 1 GB,
# sin acceso externo) se creó aparte en el workspace Draxuvo. Su URL interna se carga como DATABASE_URL.

services:
  - type: web
    name: draxuvo-api
    runtime: docker
    region: virginia             # misma región que la base (conexión por red privada)
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    # El despliegue lo dispara el job `deploy` de .github/workflows/ci.yml con el Deploy Hook, solo con el CI en
    # verde (FR-002). El servicio no está conectado a la app de GitHub de Render, así que no hay auto-deploy propio.
    autoDeployTrigger: "off"
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      # Corre Solid Queue dentro de Puma (config/puma.rb): sin esto los jobs se encolan y nadie los ejecuta.
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: DATABASE_URL        # URL interna de draxuvo-db (misma región, red privada)
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true      # firma los JWT: rotarla cierra todas las sesiones
      # Hosts y orígenes (CORS): ver FR-001 y FR-005 de la spec 012.
      - key: APP_HOST
        value: api.draxuvo.com
      - key: ALLOWED_HOSTS
        value: api.draxuvo.com
      - key: FRONTEND_URL          # panel (ui): enlaces de correo y CORS
        value: https://app.draxuvo.com
      - key: FRONTEND_URL_UI       # sitio público (web): CORS
        value: https://draxuvo.com
      # Correo (Resend)
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: Draxuvo <no-reply@draxuvo.com>
      # Stripe: modo prueba al lanzar (FR-008)
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Solo la leen los seeds al crear el super admin (db:prepare en la primera ejecución)
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      # Versión mínima de la app móvil; se sube aquí sin publicar una build nueva (FR-015)
      - key: MIN_APP_VERSION_IOS
        value: 0.0.0
      - key: MIN_APP_VERSION_ANDROID
        value: 0.0.0
      # Archivos subidos (avatares, fotos de órdenes, imágenes de productos): Cloudflare R2.
      # El disco del contenedor es efímero; sin esto se pierden en cada despliegue.
      - key: ACTIVE_STORAGE_SERVICE
        value: r2
      - key: R2_ACCOUNT_ID
        value: 653dfb7bcb7b75b826d6cef4f1a9947d
      - key: R2_BUCKET
        value: draxuvo-uploads
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      # WhatsApp (WHATSAPP_*) queda sin definir a propósito: desactivado en el lanzamiento (FR-009).
