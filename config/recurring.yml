production:
  check_expired_subscriptions:
    class: Subscriptions::CheckExpiredJob
    queue: default
    schedule: every hour
  enforce_subscription_payments:
    class: Subscriptions::EnforceJob
    queue: default
    schedule: every hour
  # Spec 039: borra las demos vencidas o terminadas.
  purge_demos:
    class: Demo::PurgeJob
    queue: default
    schedule: every 10 minutes
