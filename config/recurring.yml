production:
  check_expired_subscriptions:
    class: Subscriptions::CheckExpiredJob
    queue: default
    schedule: every hour
  enforce_subscription_payments:
    class: Subscriptions::EnforceJob
    queue: default
    schedule: every hour
  # Spec 045: avisos de stock bajo (inmediato agrupado cada 5 min y resumen diario a la hora local de cada empresa).
  stock_alerts_scan:
    class: StockAlerts::ScanJob
    queue: default
    schedule: every 5 minutes
  stock_alerts_daily_summary:
    class: StockAlerts::DailySummaryJob
    queue: default
    schedule: "0 * * * *"
  # Spec 057: alertas operativas por push (una vez por alerta).
  push_alerts_scan:
    class: Push::AlertsScanJob
    queue: default
    schedule: every minute
  push_receipts:
    class: Push::ReceiptsJob
    queue: default
    schedule: every 15 minutes
  push_prune_devices:
    class: Push::PruneDevicesJob
    queue: default
    schedule: at 4am every day
  # Spec 039: borra las demos vencidas o terminadas.
  purge_demos:
    class: Demo::PurgeJob
    queue: default
    schedule: every 10 minutes
